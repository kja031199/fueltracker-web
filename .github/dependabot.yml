version: 2
updates:
  # The pinned actions above go stale and occasionally get deprecated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # npm. Minor and patch grouped into one PR; majors stay separate because a
  # major is a breaking change that deserves its own review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
