name: Checks

# Two cheap checks that always report a status, so they are safe to require.
# Independent of each other and of ci.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.24.3
      # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz (#46). Bump it
      # with the version: a different file should be a reviewed diff, never a
      # silent one. Source: the release's gitleaks_<v>_checksums.txt, confirmed
      # against a download.
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      # Full history, not the diff: a secret committed and then deleted in a
      # later commit is still leaked.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing after checkout needs git auth; don't leave the token in
          # .git/config for later steps (#46).
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          # Verified before extraction, so a mismatch fails the job here.
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan every commit
        run: |
          set -euo pipefail
          # If this ever fires, allowlisting is NOT the fix: rotate the
          # credential first — it is in the history and must be treated as
          # compromised — then purge, then re-scan.
          ./gitleaks git . --redact --no-banner --verbose

  links:
    name: Docs links (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LYCHEE_VERSION: v0.15.1
      # SHA-256 of lychee-${LYCHEE_VERSION}-x86_64-unknown-linux-gnu.tar.gz
      # (#46). This release publishes no checksum, so the pin is the hash of two
      # downloads made hours apart that agreed: it cannot prove the first file
      # was genuine, but it does make any later change to it fail this job.
      LYCHEE_SHA256: 9afdf0f48064fdcd8a8815ca6d2d9fcd43a0ef4c2edf9da23d6f7bf46a764eb8
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config, where `npm ci` lifecycle scripts could read it (#46).
          persist-credentials: false

      - name: Install lychee
        run: |
          set -euo pipefail
          tarball="lychee-${LYCHEE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/$tarball"
          # Verified before extraction, so a mismatch fails the job here.
          echo "${LYCHEE_SHA256}  $tarball" | sha256sum --check --strict -
          tar -xzf "$tarball" lychee
          chmod +x lychee
          ./lychee --version

      - name: Check relative links and anchors
        run: |
          set -euo pipefail
          # --offline validates on-disk targets and heading anchors only.
          # External URLs are skipped on purpose: a third party's server being
          # down should never stand between a correct change and main.
          #
          # node_modules is excluded explicitly rather than relying on this job
          # happening not to install dependencies: `**/*.md` otherwise globs
          # hundreds of vendored READMEs whose broken links are not ours to fix,
          # and the check would start failing the day anyone adds an install
          # step here.
          #
          # Both trees are named, because `--exclude-path` takes a path and not
          # a glob: a nested node_modules is not covered by excluding the
          # top-level one. Installing the pinned CLI locally and running this
          # command found 777 errors in its dependencies' own documentation.
          # Kept as an allowlist of exclusions rather than narrowing the input
          # glob to our own files, so a new document is checked by default —
          # a loud failure beats a silent skip.
          ./lychee --offline --no-progress --include-fragments \
            --exclude-path node_modules \
            --exclude-path .github/firebase-cli/node_modules '**/*.md'
