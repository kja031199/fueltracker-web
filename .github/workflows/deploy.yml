name: Deploy

# Publishes to Firebase Hosting on every merge to main.
#
# Deploys used to be manual, and went wrong twice in a week: once with no
# `dist/` at all, and once nearly with a *stale* one — which is the quieter
# failure, because it serves last week's code and nothing says so.
#
# Not a required check, and deliberately not in the branch ruleset: it runs
# after merge, and a deploy that fails should not retroactively block the commit
# that caused it. The four checks on `ci.yml` and `checks.yml` are the gate.

on:
  push:
    branches: [main]
  # So a deploy can be re-run without inventing a commit — after fixing a
  # misconfigured variable, for instance. Safe from any branch: the `deploy`
  # job runs in the `production` environment, which only `main` can enter and
  # which holds the key (#76).
  workflow_dispatch:

concurrency:
  group: deploy-main
  # Deliberately NOT cancel-in-progress, unlike ci.yml. Cancelling a build is
  # free; cancelling a half-finished deploy is not.
  cancel-in-progress: false

permissions:
  contents: read

# Two jobs, and the split is the point (#76). `build` installs the app's
# dependencies — several hundred packages, lifecycle scripts included —
# builds, tests, and hands `dist/` on as an artifact. It holds no secret.
# `deploy` holds the key and runs no app-tree npm code at all: the CLI is
# installed with `--ignore-scripts`, the tested artifact is downloaded rather
# than rebuilt, and firebase.json's `predeploy` hook is stripped so
# `firebase deploy` cannot run `npm run build` with the key on disk.
# `src/test/workflows.test.ts` asserts every part of that.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Repository **variables**, not secrets. The Firebase web config is public
      # by design — Google documents it as such, and it necessarily ships inside
      # the JavaScript bundle where anyone can read it. Putting it in Secrets
      # would imply a confidentiality the deployed site does not have. The
      # service account key below is a real secret and is treated as one.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # The administrator's inactivity sign-out, in minutes, for everyone (#70).
      # Optional on purpose, and NOT in the required list below: unset — or
      # anything that is not whole minutes — means 30, never "no timeout", so
      # forgetting it cannot switch the protection off. Held to 1..1440.
      VITE_IDLE_TIMEOUT_MINUTES: ${{ vars.VITE_IDLE_TIMEOUT_MINUTES }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config, where `npm ci` lifecycle scripts could read it (#46).
          persist-credentials: false

      # Node from .nvmrc and the app from its lockfile (#99). This job holds no
      # secret; the deploy job below does not use this action (see there).
      - name: Set up
        uses: ./.github/actions/setup

      # The trap this workflow exists to not fall into. Vite inlines VITE_* at
      # build time, so with these unset the build succeeds and produces a bundle
      # with no backend — and publishing that gives a live site that loads and
      # then says it has no Firebase configuration. Failing here is the correct
      # outcome: a red deploy beats a published site that cannot sign anyone in.
      - name: Check the configuration is present
        run: |
          missing=""
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variable(s):$missing — set them under"\
                 "Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      # Builds with the configuration above, then tests that build — the one
      # this job hands on — the same way ci.yml does (#97). Merges to main are
      # already gated on four required checks with no bypass actors, so this is
      # belt-and-braces; it also makes a manual workflow_dispatch safe.
      - name: Build, and test the build
        run: npm run test:build

      - name: Test
        run: npm test

      - name: Hand the tested build to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Limited to `main` in Settings → Environments, and the only place the key
    # is stored. See docs/deploying.md, "The deploy environment".
    environment: production

    env:
      # Only what this job uses: where to deploy, and what the smoke test
      # looks for. The rest of the web config was baked in by `build`.
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

    steps:
      # For firebase.json, firestore.rules and the CLI's lockfile. The app's
      # own dependencies are never installed in this job.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not the shared setup action: it installs the app with lifecycle
      # scripts, which this job must never run, and `workflows.test.ts` can
      # only prove that by reading this job's own steps (#76, #99).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: .github/firebase-cli/package-lock.json

      # The one dependency in this project that is trusted with a credential,
      # and until #30 the only one with no version floor, no integrity hash and
      # no update review: `npx --yes firebase-tools` resolved whatever was
      # newest at the moment the job ran. It has its own manifest and lockfile
      # so `npm ci` verifies all 600-odd packages against recorded hashes,
      # without putting any of them in the app's own tree.
      #
      # `--ignore-scripts`: nothing in this tree needs an install script to
      # deploy. Only two packages have one — `protobufjs` (a version check) and
      # `re2`, an optional native module that superstatic loads in a try/catch
      # for the local server — and none of them should run in the job that is
      # about to hold the key.
      - name: Install the pinned Firebase CLI
        run: npm ci --prefix .github/firebase-cli --ignore-scripts

      - name: Fetch the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # firebase.json keeps its `predeploy` hook for deploys from a laptop,
      # where it is what stops a stale dist/ going live. Here it would rebuild
      # — running vite and its plugins with the key present — and replace the
      # artifact that was tested with one that was not.
      - name: Prepare the deploy config without the build hook
        run: |
          jq 'del(.hosting.predeploy)' firebase.json > firebase.ci.json
          if jq -e '.hosting.predeploy' firebase.ci.json > /dev/null; then
            echo "::error::firebase.ci.json still has a predeploy hook"
            exit 1
          fi
          test -f dist/index.html

      # Hand-rolled rather than google-github-actions/auth: it is three lines,
      # and it keeps a third-party action from ever holding the credential.
      # `printf` rather than `echo` so nothing in the JSON is interpreted.
      - name: Authenticate to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      # Rules first, and separately. firestore.rules uses `hasOnly`, so an
      # unknown field is refused — if a build that writes a new field went live
      # before the rules knew about it, writes would fail until they caught up.
      # A single `firebase deploy` does not promise this order.
      - name: Deploy security rules
        run: >
          .github/firebase-cli/node_modules/.bin/firebase deploy
          --config firebase.ci.json
          --only firestore:rules
          --project "$VITE_FIREBASE_PROJECT_ID"
          --non-interactive

      # Ships the artifact from `build` as it is: the config has no predeploy.
      - name: Deploy hosting
        run: >
          .github/firebase-cli/node_modules/.bin/firebase deploy
          --config firebase.ci.json
          --only hosting
          --project "$VITE_FIREBASE_PROJECT_ID"
          --non-interactive

      # End-to-end proof, and the only one available: the authoring environment
      # cannot reach *.web.app. Checks the site answers, and that the served
      # JavaScript actually carries the app id — which is what proves the
      # configuration was baked in rather than merely present on the runner.
      # Not the project id: since #45 that is a constant in the source (the
      # development guard), so it is in every bundle, configured or not.
      - name: Smoke-test the deployed site
        run: |
          url="https://$VITE_FIREBASE_PROJECT_ID.web.app"
          status=$(curl -sS -o page.html -w '%{http_code}' "$url/")
          if [ "$status" != "200" ]; then
            echo "::error::$url returned HTTP $status"
            exit 1
          fi
          if ! grep -q 'id="root"' page.html; then
            echo "::error::$url did not serve the app shell"
            exit 1
          fi
          bundle=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' page.html | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::could not find the main bundle in the served page"
            exit 1
          fi
          if ! curl -sS "$url$bundle" | grep -qF "$VITE_FIREBASE_APP_ID"; then
            echo "::error::the deployed bundle carries no Firebase configuration"
            exit 1
          fi
          echo "Deployed and serving: $url"

      # Always, including after a failed deploy, so a credential is never left
      # behind on the runner.
      - name: Remove the credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
