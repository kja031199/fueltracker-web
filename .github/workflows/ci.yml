name: CI

# Typechecks and runs the test suite on every pull request and every push to
# main. This is the gate: the ported domain logic is only trustworthy because
# its assertions run, and a red suite must be able to block a merge.
#
# Deliberately **no `paths-ignore`**. A skipped run reports no status at all,
# and a check that sometimes reports nothing can never be a *required* check —
# a docs-only PR would wait forever for a result that never arrives. The
# upstream Swift project learned this the expensive way; don't reintroduce it
# here without also giving up required-check status.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test & build
    # The gate on a pull request. On the push that merges it, the deploy builds
    # that tree, tests it and ships that build — running the suite here too was
    # the same work twice per merge (#99). Skipped, it still reports a status.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config, where `npm ci` lifecycle scripts could read it (#46).
          persist-credentials: false

      # Node from .nvmrc and `npm ci` from the lockfile, in one shared action
      # (#99). `npm ci` installs exactly what package-lock.json pins and fails
      # if the lockfile and manifest disagree.
      - name: Set up
        uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

      # Hooks only: rules-of-hooks and exhaustive-deps, as errors (#57). oxlint
      # rather than typescript-eslint, which cannot parse with TypeScript 7.
      # A step in this job rather than a new required check, so making it
      # required costs nothing.
      - name: Lint
        run: npm run lint

      # Prettier, with the repository's settings (#99). The code was formatted
      # once, in a commit `.git-blame-ignore-revs` skips; `npm run format`
      # fixes whatever this finds.
      - name: Formatting
        run: npm run format:check

      # Builds, then runs the `*.build.test.ts` files against that build (#97):
      # the manifest, the CSP and the self-hosted reader. A suite that passes
      # while the app fails to build is a green check over something nobody can
      # load, so a failed build fails this step. The build project refuses to
      # start without dist/, so these can no longer skip in silence.
      - name: Build, and test the build
        run: npm run test:build

      - name: Test
        run: npm test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A separate job because it needs the Firestore emulator, which needs Java
    # and a downloaded JAR. The main suite needs nothing but Node and that is
    # worth keeping, so the `*.emulator.test.ts` files are a Vitest project of
    # their own (#97), which `npm test` does not run — this job is the only
    # thing that runs them. The project refuses to start without an emulator,
    # so it cannot pass by skipping.
    #
    # It reports a status unconditionally, like the others, so it is safe to
    # add to the required set — and it should be. `firestore.rules` is the
    # entire security boundary of an app with no server, and the failure it
    # guards against is silent: one wrong clause and every signed-in person can
    # read everyone else's fuel log with nothing else behaving any differently.

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config, where `npm ci` lifecycle scripts could read it (#46).
          persist-credentials: false

      # The app, plus the same pinned CLI the deploy uses, a pinned Java and
      # the cached emulator JAR (#99). The CLI deliberately: this job runs on
      # every pull request, so the version that holds the credential on merge
      # is exercised here first — a broken pin fails a required check instead
      # of a deploy.
      - name: Set up, with the Firebase CLI
        uses: ./.github/actions/setup
        with:
          firebase-cli: 'true'

      # `npm run test:rules` is the pinned binary above running
      # `emulators:exec --only firestore` around the rules project; the script
      # is the one place that command is written, and
      # `src/test/projects.test.ts` holds it to that.
      - name: Test rules against the emulator
        run: npm run test:rules
