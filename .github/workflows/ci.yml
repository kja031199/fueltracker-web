name: CI

# Typechecks and runs the test suite on every pull request and every push to
# main. This is the gate: the ported domain logic is only trustworthy because
# its assertions run, and a red suite must be able to block a merge.
#
# Deliberately **no `paths-ignore`**. A skipped run reports no status at all,
# and a check that sometimes reports nothing can never be a *required* check —
# a docs-only PR would wait forever for a result that never arrives. The
# upstream Swift project learned this the expensive way; don't reintroduce it
# here without also giving up required-check status.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config, where `npm ci` lifecycle scripts could read it (#46).
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile and manifest disagree — the right call for CI, unlike
      # `npm install` which would silently resolve a different tree.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Built **before** the tests, not after. A suite that passes while the app
      # fails to build is a green check over something nobody can load — and
      # the manifest tests read the built output, so running the build second
      # would leave them silently skipping on every CI run, which is barely
      # different from not having written them.
      - name: Build
        run: npx vite build

      - name: Test
        run: npm test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A separate job because it needs the Firestore emulator, which needs Java
    # and a downloaded JAR. The main suite needs nothing but Node and that is
    # worth keeping, so `rules.test.ts` skips itself when the emulator is
    # absent — which makes this job the only thing that actually runs those
    # eight assertions.
    #
    # It reports a status unconditionally, like the others, so it is safe to
    # add to the required set — and it should be. `firestore.rules` is the
    # entire security boundary of an app with no server, and the failure it
    # guards against is silent: one wrong clause and every signed-in person can
    # read everyone else's fuel log with nothing else behaving any differently.

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config, where `npm ci` lifecycle scripts could read it (#46).
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same pinned CLI the deploy uses. Deliberately: this job runs on
      # every pull request, so the version that holds the credential on merge
      # is exercised here first — a broken pin fails a required check instead
      # of a deploy.
      - name: Install the pinned Firebase CLI
        run: npm ci --prefix .github/firebase-cli

      # Java is preinstalled on ubuntu-latest. The emulator JAR is fetched on
      # first run, which takes a few seconds.
      - name: Test rules against the emulator
        run: >
          .github/firebase-cli/node_modules/.bin/firebase emulators:exec
          --only firestore
          --project fueltracker-rules-test
          "npx vitest run src/data/firebase/rules.test.ts"
